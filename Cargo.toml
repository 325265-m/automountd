[package]
name = "automountd"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Linux disk auto-mount daemon with udev hotplug, boot-time mounting, CLI, and TUI"
license = "GPL-3.0-or-later"
authors = ["automountd contributors"]
readme = "README.md"
keywords = ["linux", "automount", "udev", "mount", "usb"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "automountd"
path = "src/lib.rs"

[[bin]]
name = "automountd"
path = "src/main.rs"

[dependencies]
# No runtime dependencies at the moment. Read the "Dependency Policy" section of CONTRIBUTING.md before adding a crate.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
panic = "unwind"
