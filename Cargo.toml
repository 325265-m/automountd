[package]
name = "automountd"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Linux 磁盘自动挂载守护进程：udev 热插拔、开机挂载、CLI 与交互界面"
license = "GPL-3.0-or-later"
authors = ["automountd contributors"]
readme = "README.md"
keywords = ["linux", "automount", "udev", "mount", "usb"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "automountd"
path = "src/lib.rs"

[[bin]]
name = "automountd"
path = "src/main.rs"

[dependencies]
# 当前无运行时依赖。新增 crate 前请阅读 CONTRIBUTING.md 的「依赖策略」。

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
panic = "unwind"
