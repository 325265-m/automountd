name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue。功能建议最好能说明使用场景，而不只是实现方式。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，确认不是重复建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到什么不便？例如“多分区移动硬盘只能挂载第一个分区”
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望 automountd 如何工作？是否考虑过替代方案？
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - udev / 热插拔
        - 挂载策略 / 安全
        - 命令行 / TUI
        - fstab 持久化
        - 桌面通知 / 用户识别
        - 打包 / systemd
        - 文档
        - 其他

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 现在如何绕过这个问题？是否有更小的改动可以解决？
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 发行版、桌面环境、相关配置等
    validations:
      required: false
