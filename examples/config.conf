# automountd example configuration
# Copy it to /etc/automountd/config.conf and adjust as needed.
# After editing: sudo automountd reload   or   sudo systemctl restart automountd

# ---------- Mount location ----------
mount_root = "/media"
per_user_dirs = true
# Empty = auto-detect the user of the current graphical session; a fixed user name also works
user = ""

# ---------- Trigger policy ----------
auto_mount_on_hotplug = true
auto_mount_on_boot = true
# Internal disks are left alone by default (especially the system disk)
auto_mount_internal_disks = false

# Allowlist: once non-empty, only the listed UUIDs are auto-mounted (useful for allowing internal data disks)
# allowed_uuids = 1234-ABCD, 5678-EFGH
allowed_uuids =
blocked_uuids =
blocked_labels =

# These types are never auto-mounted
ignored_fstypes = swap, crypto_LUKS, LVM2_member, linux_raid_member, isw_raid_member, ddf_raid_member, zfs_member, BitLocker, bcache, VMFS
# Always mounted read-only
read_only_fstypes = iso9660, squashfs, erofs

# ---------- Mount parameters ----------
# Safety options appended to every filesystem
default_mount_options = nosuid, nodev
chown_native_filesystems = false
lazy_umount = false
cleanup_dirs = true
eject_after_unmount = false
power_off_after_unmount = false

# ---------- Timing (seconds) ----------
debounce_seconds = 1.0
retry_attempts = 3
retry_delay_seconds = 2.0
mount_timeout_seconds = 60
unmount_timeout_seconds = 30
reconcile_interval_seconds = 30
# Container environments without udev can set this to 5 to enable polling
poll_interval_seconds = 0.0
suppress_remount_seconds = 60

# ---------- Notifications and interfaces ----------
notify = true
state_dir = "/run/automountd"
ctl_socket = "/run/automountd/control.sock"
# * lets every local user mount/unmount through the CLI; shutdown/reload stay root and desktop-user only
ctl_allowed_users = *

# ---------- fstab persistence ----------
fstab_path = "/etc/fstab"
persist_enabled = true

# ---------- Logging ----------
log_level = "INFO"
log_file = ""

# ---------- Per-filesystem mount options ----------
# Placeholders: {uid} {gid} {user} {label}
[mount_options]
vfat = uid={uid}, gid={gid}, umask=0022, shortname=mixed, utf8
exfat = uid={uid}, gid={gid}, umask=0022, iocharset=utf8
ntfs3 = uid={uid}, gid={gid}, umask=0022
ntfs-3g = uid={uid}, gid={gid}, umask=0022
iso9660 = uid={uid}, gid={gid}, umask=0022
udf = uid={uid}, gid={gid}, umask=0022
