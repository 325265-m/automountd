# automountd 示例配置
# 复制到 /etc/automountd/config.conf 后按需修改。
# 修改完执行: sudo automountd reload   或   sudo systemctl restart automountd

# ---------- 挂载位置 ----------
mount_root = "/media"
per_user_dirs = true
# 留空 = 自动识别当前图形会话用户；也可以写固定用户名
user = ""

# ---------- 触发策略 ----------
auto_mount_on_hotplug = true
auto_mount_on_boot = true
# 默认不碰内置磁盘（尤其是系统盘）
auto_mount_internal_disks = false

# 白名单：一旦非空，只有列出的 UUID 会自动挂载（可用来放行内置数据盘）
# allowed_uuids = 1234-ABCD, 5678-EFGH
allowed_uuids =
blocked_uuids =
blocked_labels =

# 这些类型不自动挂载
ignored_fstypes = swap, crypto_LUKS, LVM2_member, linux_raid_member, isw_raid_member, ddf_raid_member, zfs_member, BitLocker, bcache, VMFS
# 始终只读挂载
read_only_fstypes = iso9660, squashfs, erofs

# ---------- 挂载参数 ----------
# 所有文件系统都会附加的安全选项
default_mount_options = nosuid, nodev
chown_native_filesystems = false
lazy_umount = false
cleanup_dirs = true
eject_after_unmount = false
power_off_after_unmount = false

# ---------- 时序（秒） ----------
debounce_seconds = 1.0
retry_attempts = 3
retry_delay_seconds = 2.0
mount_timeout_seconds = 60
unmount_timeout_seconds = 30
reconcile_interval_seconds = 30
# 无 udev 的容器环境可设为 5，启用轮询
poll_interval_seconds = 0.0
suppress_remount_seconds = 60

# ---------- 通知与接口 ----------
notify = true
state_dir = "/run/automountd"
ctl_socket = "/run/automountd/control.sock"
# * 表示允许所有本地用户通过 CLI 挂载/卸载；shutdown/reload 仅限 root 与桌面用户
ctl_allowed_users = *

# ---------- fstab 持久化 ----------
fstab_path = "/etc/fstab"
persist_enabled = true

# ---------- 日志 ----------
log_level = "INFO"
log_file = ""

# ---------- 各文件系统挂载选项 ----------
# 占位符: {uid} {gid} {user} {label}
[mount_options]
vfat = uid={uid}, gid={gid}, umask=0022, shortname=mixed, utf8
exfat = uid={uid}, gid={gid}, umask=0022, iocharset=utf8
ntfs3 = uid={uid}, gid={gid}, umask=0022
ntfs-3g = uid={uid}, gid={gid}, umask=0022
iso9660 = uid={uid}, gid={gid}, umask=0022
udf = uid={uid}, gid={gid}, umask=0022
